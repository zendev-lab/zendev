default_install_hook_types = ["pre-commit", "commit-msg"]
default_stages = ["pre-commit"]
minimum_prek_version = "0.5.7"

[[repos]]
repo = "builtin"
hooks = [
  { id = "check-added-large-files" },
  { id = "check-case-conflict" },
  { id = "check-executables-have-shebangs" },
  { id = "check-symlinks" },
  { id = "check-toml" },
  { id = "check-yaml" },
  { id = "check-json" },
  { id = "check-merge-conflict" },
  { id = "detect-private-key" },
  { id = "end-of-file-fixer", args = ["--check"] },
  { id = "fix-byte-order-marker", args = ["--check"] },
  { id = "mixed-line-ending", args = ["--fix=no"] },
  { id = "trailing-whitespace", args = ["--check"] },
]

[[repos]]
repo = "https://github.com/pre-commit/pre-commit-hooks"
rev = "v6.0.0"
hooks = [
  { id = "check-illegal-windows-names" },
  { id = "check-shebang-scripts-are-executable" },
  { id = "destroyed-symlinks" },
  { id = "forbid-new-submodules" },
]

[[repos]]
repo = "https://github.com/astral-sh/ruff-pre-commit"
rev = "v0.17.2"
hooks = [
  { id = "ruff-check", args = ["--no-fix"] },
  { id = "ruff-format", args = ["--check"] },
]

[[repos]]
repo = "https://github.com/astral-sh/ty-pre-commit"
rev = "v0.0.91"
hooks = [{ id = "ty" }]

[[repos]]
repo = "https://github.com/facebook/pyrefly-pre-commit"
rev = "1.4.0"
hooks = [
  {
    id = "pyrefly-check",
    entry = "uv run pyrefly check",
    language = "system",
  },
]

[[repos]]
repo = "https://github.com/astral-sh/uv-pre-commit"
rev = "0.13.5"
hooks = [{ id = "uv-lock", args = ["--check"] }]

[[repos]]
repo = "https://github.com/tombi-toml/tombi-pre-commit"
rev = "v1.9.0"
hooks = [
  { id = "tombi-format", args = ["--check"], exclude = "^uv\\.lock$" },
  { id = "tombi-lint", args = ["--error-on-warnings"], exclude = "^uv\\.lock$" },
]

[[repos]]
repo = "local"
hooks = [
  {
    id = "jactionlint",
    name = "GitHub Actions correctness and security",
    entry = "jactionlint --no-online --shellcheck=shellcheck --pyflakes=pyflakes",
    language = "python",
    additional_dependencies = ["jactionlint==2.3.0", "shellcheck-py==0.11.0.1", "pyflakes==3.4.0"],
    pass_filenames = false,
    files = '^(\.github/|(.*/)?action\.ya?ml$|prek\.toml$)',
    stages = ["pre-commit"],
  },
]

[[repos]]
repo = "https://github.com/zizmorcore/zizmor-pre-commit"
rev = "v1.31.1"
hooks = [{ id = "zizmor", args = ["--offline", "--min-severity", "medium"] }]

[[repos]]
repo = "https://github.com/crate-ci/typos"
rev = "v1.51.1"
hooks = [
  { id = "typos", args = ["--force-exclude"] },
]

[[repos]]
repo = "https://github.com/asamarts/alint-pre-commit"
rev = "v0.20.0"
hooks = [{ id = "alint" }]

[[repos]]
repo = "local"
hooks = [
  { id = "zendev-message", name = "zendev commit message", entry = "uv run zendev message check --commit --fix", language = "system", stages = ["commit-msg"] },
  { id = "zendev-proposal", name = "zendev proposal repository", entry = "uv run zendev proposal check", language = "system", pass_filenames = false, always_run = true },
  { id = "deptry", name = "Distribution dependencies", entry = "uv run --frozen python scripts/check_dependencies.py", language = "system", pass_filenames = false, files = "(^|/)(pyproject\\.toml|.*\\.py)$" },
  { id = "import-linter", name = "Python package boundaries", entry = "uv run --frozen lint-imports", language = "system", pass_filenames = false, files = "(^|/)(pyproject\\.toml|.*\\.py)$" },
  { id = "ast-grep", name = "Domain structure", entry = "ast-grep scan", language = "python", additional_dependencies = ["ast-grep-cli==0.51.0"], pass_filenames = false, files = "(\\.py$|^quality/ast-grep/|^sgconfig\\.yml$)" },
  { id = "ast-grep-tests", name = "Structure rule examples", entry = "ast-grep test --skip-snapshot-tests", language = "python", additional_dependencies = ["ast-grep-cli==0.51.0"], pass_filenames = false, files = "^quality/ast-grep/" },
]

[[repos]]
repo = "https://github.com/gitleaks/gitleaks"
rev = "v8.30.1"
hooks = [{ id = "gitleaks", args = ["--redact"] }]

[[repos]]
repo = "https://github.com/lycheeverse/lychee"
rev = "lychee-v0.24.2"
hooks = [
  { id = "lychee", name = "Local documentation links", require_serial = true, files = "\\.md$", args = ["LYCHEE_VERSION=0.24.2", "--offline", "--scheme", "file", "--no-progress"] },
]

[[repos]]
repo = "https://github.com/python-jsonschema/check-jsonschema"
rev = "0.39.0"
hooks = [
  { id = "check-jsonschema", alias = "renovate-schema", name = "Renovate configuration schema", files = "^\\.github/renovate\\.json$", args = ["--builtin-schema", "vendor.renovate"] },
]

[[repos]]
repo = "https://github.com/semgrep/pre-commit"
rev = "v1.182.1"
hooks = [
  { id = "semgrep", name = "Python security patterns", language_version = "python3.13", pass_filenames = false, files = "(\\.py$|^quality/semgrep/)", args = ["scan", "--config", "quality/semgrep", "--metrics=off", "--error", "src", "packages", "scripts"] },
  { id = "semgrep", alias = "semgrep-tests", name = "Security rule examples", language_version = "python3.13", pass_filenames = false, files = "^quality/semgrep/", args = ["--test", "--config", "quality/semgrep", "quality/semgrep", "--metrics=off"] },
]

[[repos]]
repo = "https://github.com/vale-cli/vale"
rev = "v3.25.1"
hooks = [
  { id = "vale", name = "Documentation terminology", require_serial = true, files = "^(README\\.md|CONTRIBUTING\\.md|docs/.*\\.md|zfps/.*\\.md)$", args = [] },
]

[[repos]]
repo = "https://github.com/rvben/rumdl-pre-commit"
rev = "v0.3.0"
hooks = [
  { id = "rumdl-check", alias = "rumdl", name = "Markdown structure", types = ["markdown"], exclude = "^tests/fixtures/", args = [] },
]
