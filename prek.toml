[[repos]]
repo = "builtin"
hooks = [
  { id = "check-added-large-files" },
  { id = "check-case-conflict" },
  { id = "check-executables-have-shebangs" },
  { id = "check-symlinks" },
  { id = "check-toml" },
  { id = "check-yaml" },
  { id = "check-json" },
  { id = "check-merge-conflict" },
  { id = "detect-private-key" },
  { id = "end-of-file-fixer" },
  { id = "fix-byte-order-marker" },
  { id = "mixed-line-ending" },
  { id = "trailing-whitespace" },
]

[[repos]]
repo = "https://github.com/pre-commit/pre-commit-hooks"
rev = "v6.0.0"
hooks = [
  { id = "check-illegal-windows-names" },
  { id = "check-shebang-scripts-are-executable" },
  { id = "destroyed-symlinks" },
  { id = "forbid-new-submodules" },
]

[[repos]]
repo = "https://github.com/astral-sh/ruff-pre-commit"
rev = "v0.16.5"
hooks = [
  { id = "ruff-check", args = ["--fix"] },
  { id = "ruff-format" },
]

[[repos]]
repo = "https://github.com/astral-sh/ty-pre-commit"
rev = "v0.0.75"
hooks = [{ id = "ty" }]

[[repos]]
repo = "https://github.com/facebook/pyrefly-pre-commit"
rev = "1.2.0"
hooks = [
  {
    id = "pyrefly-check",
    entry = "uv run pyrefly check",
    language = "system",
  },
]

[[repos]]
repo = "https://github.com/astral-sh/uv-pre-commit"
rev = "0.12.7"
hooks = [{ id = "uv-lock" }]

[[repos]]
repo = "https://github.com/tombi-toml/tombi-pre-commit"
rev = "v1.5.0"
hooks = [
  { id = "tombi-format", exclude = "^uv\\.lock$" },
  { id = "tombi-lint", args = ["--error-on-warnings"], exclude = "^uv\\.lock$" },
]

[[repos]]
repo = "https://github.com/rhysd/actionlint"
rev = "v1.7.12"
hooks = [{ id = "actionlint" }]

[[repos]]
repo = "https://github.com/zizmorcore/zizmor-pre-commit"
rev = "v1.30.0"
hooks = [{ id = "zizmor", args = ["--min-severity", "medium"] }]

[[repos]]
repo = "https://github.com/lycheeverse/lychee"
rev = "lychee-v0.24.2"
hooks = [
  {
    id = "lychee",
    files = "\\.md$",
    args = ["--offline", "--scheme", "file", "--no-progress"],
  },
]

[[repos]]
repo = "https://github.com/crate-ci/typos"
rev = "v1.50.0"
hooks = [
  { id = "typos", args = ["--force-exclude"] },
]

[[repos]]
repo = "https://github.com/zendev-lab/zendev"
rev = "v0.2.0"
hooks = [
  { id = "zendev-proposal" },
  { id = "zendev-commit-msg" },
]
