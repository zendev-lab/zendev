version = 1

[proposal]
prefix = "VEP"
number_field = "vep"
documents_dir = "veps"
schema = "schemas/vep.schema.json"
index = "veps-index.json"
metadata_title = "plain"

[drafts]
directory = "drafts"
schema = "schemas/draft.schema.json"
marker = "> Pre-VEP design draft. Non-normative."
pre_proposal = true

[templates]
Technical = "templates/technical.md"

[summary]
prefix = "**Executive Summary:**"
minimum_sentences = 2
maximum_sentences = 4

[graph]
fields = ["requires"]
requires_field = "requires"
accepted_status = "Accepted"
superseded_status = "Superseded"

[history]
initial_status = "Draft"
protect_records = true
bootstrap_numbers = [0]

[history.transitions]
Draft = ["Draft", "Review", "Withdrawn"]
Review = ["Review", "Draft", "Accepted", "Rejected", "Withdrawn"]
Accepted = ["Accepted", "Superseded"]
Rejected = ["Rejected"]
Withdrawn = ["Withdrawn"]
Superseded = ["Superseded"]

[index]
version = 2
entries_key = "veps"
fields = [
  "vep",
  { name = "path", source = "path" },
  "title",
  "status",
  "type",
  "requires",
  "defines",
  { name = "required_by", source = "inverse", key = "requires" },
]

[defines]
field = "defines"
anchor_prefix = "term-"
