[project]
site_name = "zendev"
site_description = "Repository-native development workflow toolkit"
site_url = "https://docs.zendev.zrr.dev/"
repo_url = "https://github.com/zendev-lab/zendev"
repo_name = "zendev-lab/zendev"
edit_uri = "edit/main/docs/"
strict = true

nav = [
  { "Home" = "index.md" },
  { "Getting started" = "getting-started.md" },
  { "Concepts" = [
    "concepts/index.md",
    { "Repository-native development" = "concepts/repository-native.md" },
    { "Configuration ownership" = "concepts/configuration-ownership.md" },
  ] },
  { "Guides" = [
    "guides/index.md",
    { "Recommended repository workflow" = "guides/repository-workflow.md" },
    { "Commits" = "guides/commits.md" },
    { "Migration" = "guides/migration.md" },
    { "Message checks" = "guides/message-checks.md" },
    { "Proposals" = "guides/proposals.md" },
    { "Project evolution" = "guides/evolution.md" },
  ] },
  { "Integrations" = [
    "integrations/index.md",
    { "prek" = "integrations/prek.md" },
    { "GitHub Actions" = "integrations/github-actions.md" },
  ] },
  { "Reference" = [
    "reference/index.md",
    { "CLI" = "reference/cli.md" },
    { "Configuration" = "reference/configuration.md" },
    { "Hooks" = "reference/hooks.md" },
    { "Packages" = "reference/packages.md" },
  ] },
  { "Development" = [
    "development/index.md",
    { "Architecture" = "development/architecture.md" },
    { "Contributing" = "development/contributing.md" },
    { "Zendev Feature Proposals ↗" = "https://github.com/zendev-lab/zendev/tree/main/zfps" },
  ] },
]

[project.theme]
features = [
  "content.action.copy",
  "content.action.edit",
  "content.action.view",
  "content.code.copy",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.path",
  "navigation.top",
  "search.highlight",
  "toc.follow",
]

# Publish /llms.txt and per-page Markdown, which also backs "Copy as Markdown".
[project.plugins.llmstxt]
markdown_description = "Zendev keeps repository policy in Git, Markdown, TOML, and JSON Schema, and supplies deterministic tools for commits, pull-request messages, and proposal records."
full_output = "llms-full.txt"

[project.plugins.llmstxt.sections]
"Getting started" = ["index.md", "getting-started.md"]
"Concepts" = ["concepts/index.md", "concepts/*.md"]
"Guides" = ["guides/index.md", "guides/*.md"]
"Integrations" = ["integrations/index.md", "integrations/*.md"]
"Reference" = ["reference/index.md", "reference/*.md"]
"Development" = ["development/index.md", "development/*.md"]
