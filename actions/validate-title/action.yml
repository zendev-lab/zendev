name: Validate PR title
description: "Validate a PR title against a zendev, Conventional Commits, or gitmoji profile."

inputs:
  text:
    description: "Text to validate (for example github.event.pull_request.title)."
    required: false
    default: ""
  pull-request-number:
    description: "Read the current PR title from GitHub instead of text. Required when rerunning policy after a rename."
    required: false
    default: ""
  token:
    description: "GitHub token with pull-requests: read for pull-request-number."
    required: false
    default: ${{ github.token }}
  profile:
    description: "Optional profile override (zendev, conventional, or gitmoji)."
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Set up uv
      uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      with:
        python-version: "3.14"

    - name: Validate title
      shell: bash
      env:
        INPUT_TEXT: ${{ inputs.text }}
        INPUT_PROFILE: ${{ inputs.profile }}
        INPUT_PR_NUMBER: ${{ inputs.pull-request-number }}
        GH_TOKEN: ${{ inputs.token }}
      run: |
        set -euo pipefail

        zendev_root="$(cd "${GITHUB_ACTION_PATH}/../.." && pwd)"
        echo "Using zendev from ${zendev_root}"
        if [[ -n "${INPUT_PR_NUMBER}" ]]; then
          if [[ -n "${INPUT_TEXT}" || ! "${INPUT_PR_NUMBER}" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::Supply either text or a positive pull-request-number."
            exit 2
          fi
          INPUT_TEXT="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${INPUT_PR_NUMBER}" --jq '.title')"
        fi
        args=(zendev-message check --title --format github --text "${INPUT_TEXT}")
        if [[ -n "${INPUT_PROFILE}" ]]; then
          args+=(--profile "${INPUT_PROFILE}")
        fi
        uvx --from "${zendev_root}/packages/zendev-message" \
          --with "${zendev_root}/packages/zendev-core" "${args[@]}"
