name: Validate PR title
description: Validate a PR title against a zendev, Conventional Commits, or gitmoji profile.

inputs:
  text:
    description: Text to validate (for example github.event.pull_request.title).
    required: true
  profile:
    description: Commit profile (auto, zendev, conventional, or gitmoji).
    required: false
    default: "auto"

runs:
  using: composite
  steps:
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: "3.14"

    - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6

    - name: Validate title
      shell: bash
      env:
        INPUT_TEXT: ${{ inputs.text }}
        INPUT_PROFILE: ${{ inputs.profile }}
      run: |
        set -euo pipefail

        zendev_root="$(cd "${GITHUB_ACTION_PATH}/../.." && pwd)"
        echo "Using zendev from ${zendev_root}"
        uvx --from "${zendev_root}" zendev message check --title --profile "${INPUT_PROFILE}" --text "${INPUT_TEXT}"
