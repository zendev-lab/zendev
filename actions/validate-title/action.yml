name: Validate PR title
description: "Validate a PR title against a zendev, Conventional Commits, or gitmoji profile."

inputs:
  text:
    description: "Text to validate (for example github.event.pull_request.title)."
    required: true
  profile:
    description: "Optional profile override (zendev, conventional, or gitmoji)."
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Set up uv
      uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      with:
        python-version: "3.14"

    - name: Validate title
      shell: bash
      env:
        INPUT_TEXT: ${{ inputs.text }}
        INPUT_PROFILE: ${{ inputs.profile }}
      run: |
        set -euo pipefail

        zendev_root="$(cd "${GITHUB_ACTION_PATH}/../.." && pwd)"
        echo "Using zendev from ${zendev_root}"
        args=(zendev-message check --title --format github --text "${INPUT_TEXT}")
        if [[ -n "${INPUT_PROFILE}" ]]; then
          args+=(--profile "${INPUT_PROFILE}")
        fi
        uvx --from "${zendev_root}/packages/zendev-message" \
          --with "${zendev_root}/packages/zendev-core" "${args[@]}"
