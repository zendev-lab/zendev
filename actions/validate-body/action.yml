name: Validate PR body
description: "Validate a PR body against the repository PR template."

inputs:
  body:
    description: "PR body text (for example github.event.pull_request.body)."
    required: true
  template:
    description: "Path to the PR template file relative to the repo root."
    required: false
    default: ".github/pull_request_template.md"
  require-checklist:
    description: "When true, require checked rows from the template checklist section."
    required: false
    default: "false"
  checklist-section:
    description: "H2 title, without \"##\", containing the checklist rows."
    required: false
    default: "Checklist"
  fail-on-empty-checklist:
    description: "When true, fail if require-checklist is enabled and the template has no checked rows."
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Set up uv
      uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
      with:
        python-version: "3.14"

    - name: Validate body
      shell: bash
      env:
        INPUT_BODY: ${{ inputs.body }}
        INPUT_TEMPLATE: ${{ inputs.template }}
        INPUT_REQUIRE_CHECKLIST: ${{ inputs.require-checklist }}
        INPUT_CHECKLIST_SECTION: ${{ inputs.checklist-section }}
        INPUT_FAIL_ON_EMPTY_CHECKLIST: ${{ inputs.fail-on-empty-checklist }}
      run: |
        set -euo pipefail

        zendev_root="$(cd "${GITHUB_ACTION_PATH}/../.." && pwd)"
        echo "Using zendev from ${zendev_root}"
        args=(
          zendev message check
          --body
          --text "${INPUT_BODY}"
          --template "${INPUT_TEMPLATE}"
        )
        if [[ "${INPUT_REQUIRE_CHECKLIST}" == "true" ]]; then
          args+=(--require-checklist --checklist-section "${INPUT_CHECKLIST_SECTION}")
          if [[ "${INPUT_FAIL_ON_EMPTY_CHECKLIST}" == "true" ]]; then
            args+=(--fail-on-empty-checklist)
          fi
        fi
        uvx --from "${zendev_root}" "${args[@]}"
