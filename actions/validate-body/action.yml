name: Validate PR body
description: "Validate a PR body against the repository PR template."

inputs:
  body:
    description: "PR body text (for example github.event.pull_request.body)."
    required: true
  template:
    description: "Path to the PR template file relative to the repo root."
    required: false
    default: ""
  require-checklist:
    description: "When true, require checked rows from the template checklist section."
    required: false
    default: ""
  checklist-section:
    description: "H2 title, without \"##\", containing the checklist rows."
    required: false
    default: ""
  fail-on-empty-checklist:
    description: "When true, fail if require-checklist is enabled and the template has no checked rows."
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Set up uv
      uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      with:
        python-version: "3.14"

    - name: Validate body
      shell: bash
      env:
        INPUT_BODY: ${{ inputs.body }}
        INPUT_TEMPLATE: ${{ inputs.template }}
        INPUT_REQUIRE_CHECKLIST: ${{ inputs.require-checklist }}
        INPUT_CHECKLIST_SECTION: ${{ inputs.checklist-section }}
        INPUT_FAIL_ON_EMPTY_CHECKLIST: ${{ inputs.fail-on-empty-checklist }}
      run: |
        set -euo pipefail

        zendev_root="$(cd "${GITHUB_ACTION_PATH}/../.." && pwd)"
        echo "Using zendev from ${zendev_root}"
        args=(zendev-message check --body --format github --text "${INPUT_BODY}")
        if [[ -n "${INPUT_TEMPLATE}" ]]; then
          args+=(--template "${INPUT_TEMPLATE}")
        fi
        if [[ -n "${INPUT_CHECKLIST_SECTION}" ]]; then
          args+=(--checklist-section "${INPUT_CHECKLIST_SECTION}")
        fi
        case "${INPUT_REQUIRE_CHECKLIST}" in
          true) args+=(--require-checklist) ;;
          false) args+=(--no-require-checklist) ;;
          "") ;;
          *) echo "require-checklist must be true or false" >&2; exit 2 ;;
        esac
        case "${INPUT_FAIL_ON_EMPTY_CHECKLIST}" in
          true) args+=(--fail-on-empty-checklist) ;;
          false) args+=(--allow-empty-checklist) ;;
          "") ;;
          *) echo "fail-on-empty-checklist must be true or false" >&2; exit 2 ;;
        esac
        uvx --from "${zendev_root}/packages/zendev-message" \
          --with "${zendev_root}/packages/zendev-core" "${args[@]}"
