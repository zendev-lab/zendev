[project]
name = "zendev"
description = "Complete repository-native development workflow toolkit"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
  "typer>=0.27",
  "zendev-commit",
  "zendev-log",
  "zendev-proposal",
  "zendev-review",
]
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/zendev-lab/zendev"
Issues = "https://github.com/zendev-lab/zendev/issues"
Repository = "https://github.com/zendev-lab/zendev"

[project.scripts]
zendev = "zendev.__main__:main"

[dependency-groups]
dev = [
  { include-group = "check" },
  { include-group = "test" },
]
check = [
  "pyright>=1.1",
]
test = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
]

[build-system]
requires = ["hatch-vcs", "hatchling"]
build-backend = "hatchling.build"

[tool.coverage.run]
branch = true
source = ["zendev"]
omit = ["*/tests/*"]

[tool.coverage.report]
precision = 2
show_missing = true
exclude_lines = [
  "pragma: no cover",
  "def __repr__",
  "raise AssertionError",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
  "@abstractmethod",
  "\\.\\.\\.",
]

[tool.coverage.xml]
output = "coverage.xml"

[tool.hatch.build.hooks.vcs]
version-file = "src/zendev/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/zendev"]

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
fallback_version = "0.0.0"

[tool.pyright]
typeCheckingMode = "standard"
pythonVersion = "3.12"

[tool.pytest]
addopts = ["--strict-markers", "--tb=short"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
src = ["src", "packages", "tests"]
target-version = "py312"

[tool.ruff.lint]
select = [
  "E",  # pycodestyle errors
  "W",  # pycodestyle warnings
  "F",  # pyflakes
  "I",  # isort
  "UP",  # pyupgrade
  "B",  # flake8-bugbear
  "SIM",  # flake8-simplify
  "C4",  # flake8-comprehensions
  "FA",  # flake8-future-annotations
  "RUF",  # ruff-specific rules
]

[tool.ruff.lint.isort]
known-first-party = ["zendev"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "I002"]
"tests/**" = ["D"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.zendev.commit]
profile = "zendev"

[tool.uv]
default-groups = ["check", "test"]

[tool.uv.sources]
zendev-commit = { workspace = true }
zendev-log = { workspace = true }
zendev-proposal = { workspace = true }
zendev-review = { workspace = true }

[tool.uv.workspace]
members = ["packages/*"]
