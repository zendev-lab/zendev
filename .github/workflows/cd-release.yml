name: CD - Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify:
    name: Verify release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Verify release
        run: |
          uv sync --all-packages --all-groups
          uvx prek run --all-files
          uv run pyright
          uv run pytest -v

  build:
    name: Build ${{ matrix.package }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - zendev
          - zendev-commit
          - zendev-log
          - zendev-proposal
          - zendev-review
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Build wheel
        run: uv build --package "${{ matrix.package }}" --wheel --out-dir dist

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.package }}
          path: dist/*.whl
          if-no-files-found: error

  publish-commit:
    name: Publish zendev-commit
    needs: [verify, build]
    runs-on: ubuntu-latest
    environment: pypi-zendev-commit
    permissions:
      actions: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist-zendev-commit
          path: dist

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: ${{ github.ref_name == 'v0.2.0' }}

  publish-log:
    name: Publish zendev-log
    needs: publish-commit
    runs-on: ubuntu-latest
    environment: pypi-zendev-log
    permissions:
      actions: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist-zendev-log
          path: dist

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: ${{ github.ref_name == 'v0.2.0' }}

  publish-proposal:
    name: Publish zendev-proposal
    needs: publish-log
    runs-on: ubuntu-latest
    environment: pypi-zendev-proposal
    permissions:
      actions: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist-zendev-proposal
          path: dist

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: ${{ github.ref_name == 'v0.2.0' }}

  publish-review:
    name: Publish zendev-review
    needs: publish-proposal
    runs-on: ubuntu-latest
    environment: pypi-zendev-review
    permissions:
      actions: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist-zendev-review
          path: dist

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: ${{ github.ref_name == 'v0.2.0' }}

  publish-zendev:
    name: Publish zendev
    needs: publish-review
    runs-on: ubuntu-latest
    permissions:
      actions: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist-zendev
          path: dist

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: ${{ github.ref_name == 'v0.2.0' }}

  github-release:
    name: Create GitHub release
    needs: publish-zendev
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
