name: Automation - PR Labels

on:
  # This workflow never checks out or executes pull request code. Its only
  # untrusted input is reduced to a boolean by the expression evaluator.
  pull_request_target: # zizmor: ignore[dangerous-triggers]
    types: [opened, edited, reopened, synchronize, ready_for_review]

permissions: {}

jobs:
  labels:
    name: PR label classification
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Reconcile PR labels
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          IS_DOCUMENTATION: >-
            ${{ startsWith(github.event.pull_request.title, '📝 docs') &&
            !startsWith(github.event.pull_request.title, '📝 docs(zfp):') }}
          IS_PROPOSAL: ${{ startsWith(github.event.pull_request.title, '📝 docs(zfp):') }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          has_documentation_label="$(
            gh api \
              --header "X-GitHub-Api-Version: 2026-03-10" \
              "repos/${GH_REPO}/issues/${PR_NUMBER}/labels" \
              --jq 'any(.name == "documentation")'
          )"
          has_proposal_label="$(
            gh api \
              --header "X-GitHub-Api-Version: 2026-03-10" \
              "repos/${GH_REPO}/issues/${PR_NUMBER}/labels" \
              --jq 'any(.name == "proposal")'
          )"

          if [[ "$IS_PROPOSAL" == "true" ]]; then
            if [[ "$has_proposal_label" == "false" ]]; then
              gh api \
                --method POST \
                --header "X-GitHub-Api-Version: 2026-03-10" \
                "repos/${GH_REPO}/issues/${PR_NUMBER}/labels" \
                --field "labels[]=proposal"
            fi
            if [[ "$has_documentation_label" == "true" ]]; then
              gh api \
                --method DELETE \
                --header "X-GitHub-Api-Version: 2026-03-10" \
                "repos/${GH_REPO}/issues/${PR_NUMBER}/labels/documentation"
            fi
          elif [[ "$IS_DOCUMENTATION" == "true" ]]; then
            if [[ "$has_documentation_label" == "false" ]]; then
              gh api \
                --method POST \
                --header "X-GitHub-Api-Version: 2026-03-10" \
                "repos/${GH_REPO}/issues/${PR_NUMBER}/labels" \
                --field "labels[]=documentation"
            fi
            if [[ "$has_proposal_label" == "true" ]]; then
              gh api \
                --method DELETE \
                --header "X-GitHub-Api-Version: 2026-03-10" \
                "repos/${GH_REPO}/issues/${PR_NUMBER}/labels/proposal"
            fi
          else
            if [[ "$has_documentation_label" == "true" ]]; then
              gh api \
                --method DELETE \
                --header "X-GitHub-Api-Version: 2026-03-10" \
                "repos/${GH_REPO}/issues/${PR_NUMBER}/labels/documentation"
            fi
            if [[ "$has_proposal_label" == "true" ]]; then
              gh api \
                --method DELETE \
                --header "X-GitHub-Api-Version: 2026-03-10" \
                "repos/${GH_REPO}/issues/${PR_NUMBER}/labels/proposal"
            fi
          fi
