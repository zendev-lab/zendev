name: CI - Static Checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: j178/prek-action@v1

      - name: Validate public hook manifest
        run: uvx --from prek==0.4.13 prek validate-manifest .pre-commit-hooks.yaml

      - name: Exercise public hooks
        run: |
          printf '%s\n' '✨ feat(hooks): validate public hooks' > .git/COMMIT_EDITMSG
          uvx --from prek==0.4.13 prek try-repo . zendev-proposal --all-files
          uvx --from prek==0.4.13 prek try-repo . zendev-proposal-index --stage manual --all-files
          uvx --from prek==0.4.13 prek try-repo . zendev-commit-msg --stage commit-msg --commit-msg-filename .git/COMMIT_EDITMSG
          git diff --exit-code
