name: Automation - PR Title

on:
  # Only the trusted default branch supplies executable code.
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: ["Policy - PR"]
    types: [completed]

permissions: {}

concurrency:
  group: automation-pr-title-${{ github.event.workflow_run.head_repository.full_name }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  title:
    name: Normalize PR title
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      actions: write
    steps:
      - name: Check out the trusted automation implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Normalize the title and rerun failed policy
        uses: ./actions/normalize-title
