name: Automation - PR Title

on:
  # Read PR metadata through a pinned Action; never check out PR code.
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: ["Policy - PR"]
    types: [completed]

permissions: {}

concurrency:
  group: automation-pr-title-${{ github.event.workflow_run.head_repository.full_name }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  title:
    name: Normalize PR title
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      actions: write
    steps:
      - name: Normalize the title and rerun failed policy
        uses: zendev-lab/zendev/actions/normalize-title@846ec3d37b3bf0600355f89c0bca46373ac5966f # message normalization
