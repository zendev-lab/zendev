[project]
name = "zendev-commit"
description = "Commit-message conventions and interactive commit workflows"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
  "questionary>=2.1",
  "typer>=0.27",
]
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/zendev-lab/zendev"
Issues = "https://github.com/zendev-lab/zendev/issues"
Repository = "https://github.com/zendev-lab/zendev"

[project.scripts]
zendev-commit = "zendev.commit:main"

[build-system]
requires = ["hatch-vcs", "hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zendev"]

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
root = "../.."
fallback_version = "0.0.0"
