[project]
name = "zendev-message"
description = "Commit and pull-request message validation"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dynamic = ["dependencies", "version"]

[project.urls]
Documentation = "https://docs.zendev.zrr.dev/"
Homepage = "https://github.com/zendev-lab/zendev"
Issues = "https://github.com/zendev-lab/zendev/issues"
Repository = "https://github.com/zendev-lab/zendev"

[project.scripts]
zendev-commit = "zendev.message.interactive:main"
zendev-message = "zendev.message.cli:main"

[build-system]
requires = ["hatch-vcs", "hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zendev"]

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
root = "../.."
fallback_version = "0.0.0"

[tool.hatch.metadata.hooks.custom]
path = "hatch_build.py"
dependencies = [
  "typer>=0.27",
  "zendev-core=={version}",
  "questionary>=2.1",
]

[tool.uv.sources]
zendev-core = { workspace = true }
