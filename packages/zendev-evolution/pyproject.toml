[project]
name = "zendev-evolution"
description = "Single-file project intent and evolution records"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dynamic = ["dependencies", "version"]

[project.urls]
Documentation = "https://docs.zendev.zrr.dev/"
Homepage = "https://github.com/zendev-lab/zendev"
Issues = "https://github.com/zendev-lab/zendev/issues"
Repository = "https://github.com/zendev-lab/zendev"

[project.scripts]
zendev-evolution = "zendev.evolution.cli:main"

[build-system]
requires = ["hatch-vcs", "hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zendev"]

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
root = "../.."
fallback_version = "0.0.0"

[tool.hatch.metadata.hooks.custom]
path = "../../hatch_build.py"
dependencies = [
  "typer>=0.27",
  "zendev-core=={version}",
]

[tool.uv]
cache-keys = [
  { file = "../../pyproject.toml" },
  { file = "../../packages/*/pyproject.toml" },
  { file = "../../hatch_build.py" },
  { git = { commit = true, tags = true } },
  { env = "SETUPTOOLS_SCM_PRETEND_VERSION" },
]

[tool.uv.sources]
zendev-core = { workspace = true }
