[project]
name = "zendev-proposal"
description = "Repository-native proposal validation and indexing"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
  "jsonschema[format-nongpl]>=4.23",
  "pyyaml>=6.0",
  "typer>=0.27",
]
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/zendev-lab/zendev"
Issues = "https://github.com/zendev-lab/zendev/issues"
Repository = "https://github.com/zendev-lab/zendev"

[project.scripts]
zendev-proposal = "zendev.proposal.cli:main"

[build-system]
requires = ["hatch-vcs", "hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zendev"]

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
root = "../.."
fallback_version = "0.0.0"
