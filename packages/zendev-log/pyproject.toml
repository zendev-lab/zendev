[project]
name = "zendev-log"
description = "Small Loguru configuration helper for command-line applications"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
  "loguru>=0.7",
]
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/zendev-lab/zendev"
Issues = "https://github.com/zendev-lab/zendev/issues"
Repository = "https://github.com/zendev-lab/zendev"

[build-system]
requires = ["hatch-vcs", "hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zendev"]

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
root = "../.."
fallback_version = "0.0.0"
