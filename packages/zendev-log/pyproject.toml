[project]
name = "zendev-log"
description = "Small Loguru configuration helper for command-line applications"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
  "loguru>=0.7",
]
dynamic = ["version"]

[project.urls]
Documentation = "https://docs.zendev.zrr.dev/"
Homepage = "https://github.com/zendev-lab/zendev"
Issues = "https://github.com/zendev-lab/zendev/issues"
Repository = "https://github.com/zendev-lab/zendev"

[build-system]
requires = ["pdm-backend>=2.4"]
build-backend = "pdm.backend"

[tool.pdm.build]
includes = ["src/zendev"]

[tool.pdm.version]
source = "scm"
fallback_version = "0.0.0"

[tool.uv]
cache-keys = [
  { file = "../../pyproject.toml" },
  { file = "../../packages/*/pyproject.toml" },
  { file = "../../pdm_build.py" },
  { git = { commit = true, tags = true } },
  { env = "PDM_BUILD_SCM_VERSION" },
]
