- id: zendev-message-check
  name: zendev message check
  description: Validate a commit or pull-request message.
  entry: zendev message check
  language: python
  stages: [commit-msg]
- id: zendev-proposal-check
  name: zendev proposal check
  description: Validate repository-native proposals and their committed index.
  entry: zendev proposal check
  language: python
  pass_filenames: false
  always_run: true
  stages: [pre-commit]
- id: zendev-evolution-check
  name: zendev evolution check
  description: Validate initial intent and dated project evolution.
  entry: zendev evolution check
  language: python
  pass_filenames: false
  always_run: true
  stages: [pre-commit]
